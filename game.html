<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flop Boss Fight - Floptropica Wiki</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="flop-favicon.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --bg: #101018; --panel: #1c1c29; --text: #eee; --muted: #a8a8b8; --accent: #7eb8ff; --border: #39394b; }
        [data-theme="light"] { --bg: #eef4f0; --panel: #fff; --text: #171717; --muted: #58615c; --accent: #059669; --border: #d5ded8; }
        body { min-height: 100vh; background: var(--bg); color: var(--text); font-family: 'Fredoka', sans-serif; }
        .wiki-header { background: var(--panel); border-bottom: 3px solid var(--accent); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; }
        .wiki-header a { display: flex; align-items: center; gap: 12px; color: var(--accent); text-decoration: none; }
        .wiki-header img { width: 46px; height: 46px; border-radius: 6px; }
        .theme-button { border: 1px solid var(--border); border-radius: 999px; background: var(--bg); color: var(--text); padding: 8px 13px; cursor: pointer; font: inherit; }
        main { width: min(960px, 100%); margin: 0 auto; padding: 26px 16px 50px; }
        .breadcrumb { color: var(--muted); margin-bottom: 14px; font-size: .9rem; }
        .breadcrumb a { color: var(--accent); text-decoration: none; }
        h1 { font-size: clamp(2rem, 5vw, 3rem); margin-bottom: 6px; }
        .instructions { color: var(--muted); margin-bottom: 18px; line-height: 1.5; }
        .game-shell { overflow: hidden; border: 2px solid var(--accent); border-radius: 12px; background: #03030b; box-shadow: 0 12px 35px rgba(0,0,0,.35); }
        .hud { display: flex; justify-content: space-between; gap: 10px; padding: 11px 16px; background: #121222; color: #fff; font-weight: 500; }
        canvas { display: block; width: 100%; height: auto; aspect-ratio: 3 / 2; background: #050510; touch-action: none; }
        .controls { display: grid; grid-template-columns: repeat(3, 58px) 1fr 88px; gap: 8px; align-items: center; padding: 12px; background: #121222; }
        .control { min-height: 48px; border: 1px solid #52526a; border-radius: 9px; background: #24243a; color: white; font: 500 1.1rem 'Fredoka', sans-serif; cursor: pointer; user-select: none; touch-action: none; }
        .control:active, .control.active { background: var(--accent); color: #111; }
        .up { grid-column: 2; grid-row: 1; } .left { grid-column: 1; grid-row: 2; } .down { grid-column: 2; grid-row: 2; } .right { grid-column: 3; grid-row: 2; }
        .fire { grid-column: 5; grid-row: 1 / 3; height: 100%; background: #9e2638; border-color: #e15d72; }
        .pause { grid-column: 4; grid-row: 1 / 3; justify-self: end; padding: 0 20px; }
        .game-actions { text-align: center; margin-top: 18px; }
        .restart { display: none; border: 0; border-radius: 8px; background: var(--accent); color: #111; padding: 11px 20px; font: 500 1rem 'Fredoka', sans-serif; cursor: pointer; }
        .restart.show { display: inline-block; }
        footer { text-align: center; border-top: 1px solid var(--border); padding: 25px; color: var(--muted); }
        footer a { color: var(--accent); text-decoration: none; }
        @media (min-width: 760px) { .controls { display: none; } }
        @media (max-width: 520px) { .wiki-header h2 { font-size: 1.1rem; } .hud { font-size: .85rem; padding: 9px; } main { padding-inline: 8px; } }
    </style>
</head>
<body>
    <header class="wiki-header">
        <a href="index.html"><img src="flop-favicon.png" alt="Floptropica"><h2>Floptropica Wiki</h2></a>
        <button class="theme-button" id="themeButton" type="button" aria-label="Toggle color theme">☀️ / 🌙</button>
    </header>
    <main>
        <div class="breadcrumb"><a href="index.html">Main Page</a> &rsaquo; Flop Boss Fight</div>
        <h1>❤️ Flop Boss Fight</h1>
        <p class="instructions"><strong>Controls:</strong> Arrow keys or WASD to move · Space to dash · P to pause · Enter to restart</p>
        <section class="game-shell" aria-label="Flop Boss Fight game">
            <div class="hud"><span>Score: <b id="score">0</b></span><span>Level: <b id="level">1</b></span><span>Round: <b id="round">1/10</b></span><span>HP: <b id="lives">3</b></span><span>High: <b id="highScore">0</b></span></div>
            <canvas id="game" width="900" height="600" tabindex="0" aria-label="Use arrow keys to move and Space to dash"></canvas>
            <div class="controls" aria-label="Touch controls">
                <button class="control up" data-key="ArrowUp" aria-label="Move up">▲</button>
                <button class="control left" data-key="ArrowLeft" aria-label="Move left">◀</button>
                <button class="control down" data-key="ArrowDown" aria-label="Move down">▼</button>
                <button class="control right" data-key="ArrowRight" aria-label="Move right">▶</button>
                <button class="control pause" id="pauseButton" aria-label="Pause game">Pause</button>
                <button class="control fire" data-key="Space" aria-label="Dash">Dash</button>
            </div>
        </section>
        <div class="game-actions"><button class="restart" id="restartButton" type="button">Play Again</button></div>
    </main>
    <footer><a href="index.html">&larr; Back to Main Page</a></footer>
    <script>
        (() => {
            'use strict';
            const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
            const ui = { score: document.getElementById('score'), level: document.getElementById('level'), round: document.getElementById('round'), lives: document.getElementById('lives'), high: document.getElementById('highScore'), restart: document.getElementById('restartButton'), pause: document.getElementById('pauseButton') };
            const arena = {x: 145, y: 105, w: 610, h: 405};
            const imageFiles = ['floppfp.png', 'invader1.png', 'invader2.png', 'invader3.png', 'invader4.png', 'invader5.png'];
            const images = imageFiles.map(src => { const image = new Image(); image.src = src; return image; });
            const keys = new Set(), stars = Array.from({length: 90}, () => ({x: Math.random() * 900, y: Math.random() * 600, r: Math.random() * 1.8 + .2}));
            let player, attacks, particles, level, round, hp, score, highScore, attackTimer, intermission, state, lastTime;

            function resetGame() {
                level = 1; hp = 3; score = 0; highScore = Number(localStorage.getItem('flop-boss-high') || 0);
                player = {x: 423, y: 425, w: 44, h: 44, speed: 255, invulnerable: 1.2, dash: 0, dashCooldown: 0};
                attacks = []; particles = []; state = 'playing'; intermission = 0; ui.restart.classList.remove('show'); startLevel(); canvas.focus();
            }
            function startLevel() { round = 0; attackTimer = 1.2; attacks = []; updateHud(); }
            function updateHud() { ui.score.textContent = Math.floor(score); ui.level.textContent = level; ui.round.textContent = `${Math.max(1, round)}/10`; ui.lives.textContent = '♥'.repeat(hp) || '0'; ui.high.textContent = highScore; }
            function rectsOverlap(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
            function imageIndex() { return 1 + Math.floor(Math.random() * 5); }
            function makeAttack(side, aimed, offset = 0) {
                const horizontal = side === 'left' || side === 'right';
                const beamSize = Math.min(78, 42 + level * 3);
                const center = aimed ? (horizontal ? player.y + player.h / 2 : player.x + player.w / 2) : (horizontal ? arena.y + 45 + Math.random() * (arena.h - 90) : arena.x + 45 + Math.random() * (arena.w - 90));
                return {side, horizontal, center: Math.max(horizontal ? arena.y + beamSize / 2 : arena.x + beamSize / 2, Math.min(horizontal ? arena.y + arena.h - beamSize / 2 : arena.x + arena.w - beamSize / 2, center + offset)), size: beamSize, image: imageIndex(), phase: 'warning', timer: Math.max(.38, 1.05 - level * .065), activeTime: Math.min(1.15, .55 + level * .045)};
            }
            function launchPattern() {
                round++;
                const sides = ['left', 'right', 'top', 'bottom'];
                const primary = sides[Math.floor(Math.random() * sides.length)];
                attacks.push(makeAttack(primary, level >= 2 && Math.random() < .55));
                if (level >= 2 && Math.random() < .55) attacks.push(makeAttack(sides[(sides.indexOf(primary) + 2) % 4], false, (Math.random() - .5) * 180));
                if (level >= 4 && Math.random() < .65) {
                    const perpendicular = primary === 'left' || primary === 'right' ? (Math.random() < .5 ? 'top' : 'bottom') : (Math.random() < .5 ? 'left' : 'right');
                    attacks.push(makeAttack(perpendicular, Math.random() < .6));
                }
                if (level >= 7) attacks.push(makeAttack(sides[Math.floor(Math.random() * 4)], false));
                updateHud();
            }
            function beamRect(attack) { return attack.horizontal ? {x: arena.x, y: attack.center - attack.size / 2, w: arena.w, h: attack.size} : {x: attack.center - attack.size / 2, y: arena.y, w: attack.size, h: arena.h}; }
            function dash() { if (state !== 'playing' || player.dashCooldown > 0) return; player.dash = .2; player.dashCooldown = Math.max(1.25, 2.5 - level * .04); player.invulnerable = Math.max(player.invulnerable, .25); burst(player.x + 22, player.y + 22, '#7ee7ff'); }
            function burst(x, y, color) { for (let i = 0; i < 16; i++) particles.push({x, y, vx: (Math.random() - .5) * 220, vy: (Math.random() - .5) * 220, life: .65, color}); }
            function hitPlayer() {
                if (player.invulnerable > 0) return; hp--; player.invulnerable = .95; burst(player.x + 22, player.y + 22, '#ff355d'); updateHud();
                if (hp <= 0) endGame();
            }
            function endGame() { state = 'gameover'; if (score > highScore) { highScore = Math.floor(score); localStorage.setItem('flop-boss-high', highScore); updateHud(); } ui.restart.classList.add('show'); }
            function togglePause() { if (state === 'playing' || state === 'intermission') state = 'paused'; else if (state === 'paused') state = intermission > 0 ? 'intermission' : 'playing'; ui.pause.textContent = state === 'paused' ? 'Resume' : 'Pause'; }

            function update(dt) {
                if (state === 'paused' || state === 'gameover') return;
                if (state === 'intermission') { intermission -= dt; if (intermission <= 0) { state = 'playing'; startLevel(); } return; }
                score += dt * (25 + level * 5); player.invulnerable -= dt; player.dash -= dt; player.dashCooldown -= dt;
                let dx = 0, dy = 0;
                if (keys.has('ArrowLeft') || keys.has('KeyA')) dx--; if (keys.has('ArrowRight') || keys.has('KeyD')) dx++;
                if (keys.has('ArrowUp') || keys.has('KeyW')) dy--; if (keys.has('ArrowDown') || keys.has('KeyS')) dy++;
                if (dx && dy) { dx *= .707; dy *= .707; }
                const speed = player.speed * (player.dash > 0 ? 2.7 : 1);
                player.x = Math.max(arena.x + 5, Math.min(arena.x + arena.w - player.w - 5, player.x + dx * speed * dt));
                player.y = Math.max(arena.y + 5, Math.min(arena.y + arena.h - player.h - 5, player.y + dy * speed * dt));
                attackTimer -= dt;
                if (attackTimer <= 0 && round < 10) { launchPattern(); attackTimer = Math.max(.48, 1.55 - level * .09) * (.85 + Math.random() * .35); }
                attacks.forEach(attack => {
                    attack.timer -= dt;
                    if (attack.timer <= 0 && attack.phase === 'warning') { attack.phase = 'active'; attack.timer = attack.activeTime; }
                    else if (attack.timer <= 0) attack.dead = true;
                    if (attack.phase === 'active' && rectsOverlap({x: player.x + 8, y: player.y + 8, w: player.w - 16, h: player.h - 16}, beamRect(attack))) hitPlayer();
                });
                attacks = attacks.filter(attack => !attack.dead);
                particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }); particles = particles.filter(p => p.life > 0);
                if (round === 10 && attacks.length === 0) { score += level * 750; level++; hp = Math.min(3, hp + 1); state = 'intermission'; intermission = 2.4; updateHud(); }
                if (score > highScore) highScore = Math.floor(score); updateHud();
            }

            function drawImage(image, object) { if (image.complete && image.naturalWidth) ctx.drawImage(image, object.x, object.y, object.w, object.h); }
            function drawAttack(attack) {
                const image = images[attack.image], rect = beamRect(attack), pulse = .5 + Math.sin(performance.now() / 55) * .35;
                if (attack.phase === 'warning') {
                    ctx.save(); ctx.fillStyle = '#ff214f'; ctx.globalAlpha = .65 + pulse * .35;
                    if (attack.horizontal) ctx.fillRect(attack.side === 'left' ? arena.x - 56 : arena.x + arena.w + 8, rect.y, 48, rect.h);
                    else ctx.fillRect(rect.x, attack.side === 'top' ? arena.y - 56 : arena.y + arena.h + 8, rect.w, 48);
                    const marker = attack.horizontal ? {x: attack.side === 'left' ? arena.x - 52 : arena.x + arena.w + 12, y: attack.center - 20, w: 40, h: 40} : {x: attack.center - 20, y: attack.side === 'top' ? arena.y - 52 : arena.y + arena.h + 12, w: 40, h: 40};
                    drawImage(image, marker); ctx.restore(); return;
                }
                ctx.save(); ctx.beginPath(); ctx.rect(rect.x, rect.y, rect.w, rect.h); ctx.clip();
                ctx.fillStyle = 'rgba(255,25,65,.28)'; ctx.fillRect(rect.x, rect.y, rect.w, rect.h); ctx.shadowColor = '#ff1749'; ctx.shadowBlur = 18;
                const tile = Math.max(28, attack.size - 8);
                if (attack.horizontal) for (let x = rect.x - tile; x < rect.x + rect.w + tile; x += tile) drawImage(image, {x, y: attack.center - tile / 2, w: tile, h: tile});
                else for (let y = rect.y - tile; y < rect.y + rect.h + tile; y += tile) drawImage(image, {x: attack.center - tile / 2, y, w: tile, h: tile});
                ctx.restore();
            }
            function render() {
                ctx.fillStyle = '#050510'; ctx.fillRect(0, 0, 900, 600); ctx.fillStyle = '#fff'; stars.forEach(s => { ctx.globalAlpha = .25 + s.r / 4; ctx.fillRect(s.x, s.y, s.r, s.r); }); ctx.globalAlpha = 1;
                ctx.fillStyle = '#050510';
                ctx.fillRect(arena.x - 64, arena.y - 5, 64, arena.h + 10); ctx.fillRect(arena.x + arena.w, arena.y - 5, 64, arena.h + 10);
                ctx.fillRect(arena.x - 5, arena.y - 64, arena.w + 10, 64); ctx.fillRect(arena.x - 5, arena.y + arena.h, arena.w + 10, 64);
                drawImage(images[1 + ((level - 1) % 5)], {x: 25, y: 20, w: 64, h: 64});
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; ctx.strokeRect(arena.x, arena.y, arena.w, arena.h); attacks.forEach(drawAttack);
                ctx.globalAlpha = player.invulnerable > 0 && Math.floor(player.invulnerable * 12) % 2 ? .35 : 1; ctx.shadowColor = player.dash > 0 ? '#65eaff' : 'transparent'; ctx.shadowBlur = 20; drawImage(images[0], player); ctx.shadowBlur = 0; ctx.globalAlpha = 1;
                particles.forEach(p => { ctx.globalAlpha = Math.max(0, p.life * 1.5); ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 5, 5); }); ctx.globalAlpha = 1;
                ctx.fillStyle = '#fff'; ctx.font = '500 16px Fredoka, sans-serif'; ctx.textAlign = 'left'; ctx.fillText(`ROUND ${Math.max(1, round)} / 10`, arena.x + 12, arena.y + arena.h - 12);
                ctx.textAlign = 'right'; ctx.fillStyle = player.dashCooldown <= 0 ? '#65eaff' : '#aaa'; ctx.fillText(player.dashCooldown <= 0 ? 'DASH READY' : `DASH ${player.dashCooldown.toFixed(1)}s`, arena.x + arena.w - 12, arena.y + arena.h - 12);
                if (state === 'paused' || state === 'gameover' || state === 'intermission') {
                    ctx.fillStyle = 'rgba(0,0,0,.72)'; ctx.fillRect(0, 0, 900, 600); ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = '500 54px Fredoka, sans-serif';
                    ctx.fillText(state === 'paused' ? 'PAUSED' : state === 'gameover' ? 'GAME OVER' : `LEVEL ${level}`, 450, 270);
                    ctx.font = '400 24px Fredoka, sans-serif'; ctx.fillText(state === 'paused' ? 'Press P to resume' : state === 'gameover' ? 'Press Enter to try again' : 'HP restored • Get ready!', 450, 310);
                }
            }
            function loop(time) { const dt = Math.min(.033, ((time - lastTime) || 0) / 1000); lastTime = time; update(dt); render(); requestAnimationFrame(loop); }
            window.addEventListener('keydown', event => {
                if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(event.code)) event.preventDefault();
                if (event.code === 'Space' && !event.repeat) dash(); else if (event.code === 'KeyP' && !event.repeat) togglePause(); else if (event.code === 'Enter' && state === 'gameover') resetGame(); else keys.add(event.code);
            });
            window.addEventListener('keyup', event => keys.delete(event.code));
            window.addEventListener('blur', () => { keys.clear(); if (state === 'playing' || state === 'intermission') togglePause(); });
            document.querySelectorAll('[data-key]').forEach(button => {
                const code = button.dataset.key;
                const press = event => { event.preventDefault(); button.classList.add('active'); if (code === 'Space') dash(); else keys.add(code); canvas.focus(); };
                const release = event => { event.preventDefault(); keys.delete(code); button.classList.remove('active'); };
                button.addEventListener('pointerdown', press); button.addEventListener('pointerup', release); button.addEventListener('pointercancel', release); button.addEventListener('pointerleave', release);
            });
            ui.pause.addEventListener('click', togglePause); ui.restart.addEventListener('click', resetGame);
            document.getElementById('themeButton').addEventListener('click', () => { const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = next; sessionStorage.setItem('floptropica-theme', next); });
            document.documentElement.dataset.theme = sessionStorage.getItem('floptropica-theme') || 'dark'; resetGame(); requestAnimationFrame(loop);
        })();
    </script>
</body>
</html>
